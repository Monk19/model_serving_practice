apiVersion: apps/v1
kind: Deployment
metadata:
    name: housing-price-predictor
spec:
  replicas: 2
  selector:
    matchLabels:
        app: predictor
  template:
    metadata:
      labels:
        app: predictor
    spec:
      containers:
      - name: predictor-api
        image: 731880212849.dkr.ecr.eu-north-1.amazonaws.com/houseprice-predictor:latest
        ports:
        - containerPort: 8000
# we can use kubectl set image to change name of image so that newly built images can be feed to deployment file
# kubectl set image deployment/deployment-name container-name=new-container-image:latest
